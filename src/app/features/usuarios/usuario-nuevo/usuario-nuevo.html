<h1>Creación de usuarios</h1>
<div class="form-centrado">
  <div class="campo"><label>Usuario</label><input type="text" /></div>
  <div class="campo"><label>Correo electrónico</label><input type="email" /></div>
  <div class="campo"><label>Contraseña</label><input type="password" /></div>
  <label class="recordar"><input type="checkbox" /> Recordar</label>
  <div class="campo">
    <select>
      <option value="">Seleccionar Rol</option>
      <option>Gerente</option>
      <option>Empleado</option>
    </select>
  </div>
  <button class="btn btn-naranja btn-block" (click)="guardar()">Guardar</button>
</div>
