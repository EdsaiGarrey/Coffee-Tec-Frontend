<h1>Creación de categoria</h1>
<div class="form-centrado">
  <div class="campo"><label>Tipo</label><input type="text" /></div>
  <div class="campo"><label>Nombre</label><input type="text" /></div>
  <div class="campo"><label>Descripción</label><input type="text" /></div>
  <div class="campo"><label>Estado</label>
    <label class="op"><input type="checkbox" checked /> Activo</label>
    <label class="op"><input type="checkbox" /> Inactivo</label>
  </div>
  <button class="btn btn-naranja btn-block" (click)="guardar()">Guardar</button>
</div>
